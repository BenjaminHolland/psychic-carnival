syntax = "proto3";

package land.generic.calendar.v1;
option go_package = "land.generic.event/gen;gen";
import "gnostic/openapi/v3/annotations.proto";
import "google/api/annotations.proto";


// 1. Gnostic sets document-level OpenAPI metadata
option (gnostic.openapi.v3.document) = {
  info: {
    title: "Greeter API"
    version: "1.0.0"
  }
};

message ClientGreeting {
  string name = 1;
}

message ServerGreeting {
  string content = 2;
}

service SampleService {
  rpc greeting(ClientGreeting) returns (ServerGreeting){
    option (google.api.http) = {
        post: "/v1/hello",
        body: "*"
    };
    option (gnostic.openapi.v3.operation) = {
      summary: "Say Hello"
      description: "Just says hello. That's it"
    };
  }
}

