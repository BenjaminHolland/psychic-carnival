syntax = "proto3";

package land.generic.calendar.v1;

import "google/protobuf/timestamp.proto";
import "google/protobuf/field_mask.proto";
option go_package = "land.generic.event/gen;gen";
// Audit structures to track the lifecycle of an event
message AuditAction {
  oneof action {
    CreationEvent created = 1;
    CancellationEvent cancelled = 2;
    DeletionEvent deleted = 3;
    UpdateEvent updated = 4;
  }
}

message CreationEvent {
  string event_id = 1;
  google.protobuf.Timestamp when = 2;
}

message CancellationEvent {
  string event_id = 1;
  google.protobuf.Timestamp when = 2;
}

message DeletionEvent {
  string event_id = 1;
  google.protobuf.Timestamp when = 2;
}

message UpdateEvent {
  string event_id = 1;
  google.protobuf.Timestamp when = 2;
  google.protobuf.FieldMask update_Mask = 3;
}
