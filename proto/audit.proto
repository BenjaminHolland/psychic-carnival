syntax = "proto3";

package calendar.v1;

import "google/protobuf/timestamp.proto";

// Audit structures to track the lifecycle of an event
message AuditLog {
  oneof action {
    CreationEvent created = 1;
    CancellationEvent cancelled = 2;
    DeletionEvent deleted = 3;
    UpdateEvent updated = 4;
  }
}

message CreationEvent {
  string event_id = 1;
  string user_id = 2;
  google.protobuf.Timestamp when = 3;
}

message CancellationEvent {
  string event_id = 1;
  string user_id = 2;
  google.protobuf.Timestamp when = 3;
}

message DeletionEvent {
  string event_id = 1;
  string user_id = 2;
  google.protobuf.Timestamp when = 3;
}

message UpdateEvent {
  string event_id = 1;
  string user_id = 2;
  google.protobuf.Timestamp when = 3;
  repeated Field changed_fields = 4;
}

message Field {
  oneof field {
    bool start = 1;
    bool end = 2;
    bool title = 3;
    bool description = 4;
    bool tags = 5;
  }
}
